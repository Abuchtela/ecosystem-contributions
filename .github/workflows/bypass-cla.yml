name: Bypass CLA Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  bypass-cla:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      checks: write
      pull-requests: read
    steps:
      - name: Bypass CLA Check
        run: |
          echo "CLA check bypassed - repository owner has disabled this requirement"
          echo "All contributors are covered under repository policies"
